name: Windows EXE
# Packs the game with Electron into a single portable viper-sortie.exe (no installer; double-click to play).
#  - every push: the exe is attached to the run (Actions > run > Artifacts)
#  - run manually with a version like v47: the exe is also added to that GitHub Release (same tag as the Android run)
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attach the exe to, e.g. v47 (blank = win-<run number>)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/make-www.js
      - run: node -e "require('fs').cpSync('www','desktop/www',{recursive:true});require('fs').cpSync('fonts','desktop/www/fonts',{recursive:true})"
      - run: npm install --no-save electron@33 electron-builder@25
        working-directory: desktop
      - run: npx electron-builder --win portable --publish never
        working-directory: desktop
      - run: Copy-Item desktop/dist/viper-sortie.exe viper-sortie.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: viper-sortie-windows, path: viper-sortie.exe, if-no-files-found: error }
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ inputs.version || format('win-{0}', github.run_number) }}
          name: Viper Sortie ${{ inputs.version || format('build {0}', github.run_number) }}
          files: viper-sortie.exe
