name: Android APK
# Builds an installable debug APK of the game with Capacitor.
#  - every push: APK is attached to the run as an artifact (Actions tab > run > Artifacts)
#  - run manually (Actions > Android APK > Run workflow) or push a tag like v1.0: APK is published as a public GitHub Release
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: node tools/build.js --check && node tools/make-www.js
      - run: npx cap add android && bash tools/android-patch.sh
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk viper-sortie.apk
      - uses: actions/upload-artifact@v4
        with: { name: viper-sortie-apk, path: viper-sortie.apk }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-{0}', github.run_number) }}
          name: Viper Sortie APK ${{ github.run_number }}
          files: viper-sortie.apk
          body: Debug-signed Android build. On your phone, allow "install unknown apps" for your browser, download viper-sortie.apk and open it.
