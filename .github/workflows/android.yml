name: Android APK
# Builds the game as an Android app with Capacitor, plus a Windows portable exe (job "exe").
#  - every push: a debug-signed viper-sortie.apk is attached to the run (Actions > run > Artifacts)
#  - run manually (Actions > Android APK > Run workflow) or push a tag like v1.0: published as a public GitHub Release
#  - Play Store: add the four secrets below and the same run also builds a signed release APK and an .aab bundle
#      ANDROID_KEYSTORE_BASE64 (base64 of your .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release name and tag, e.g. v40 (blank = apk-<run number>)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # the ubuntu runner already ships the Android SDK; just accept its licenses so Gradle can fetch missing platform pieces
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: node tools/build.js --check && node tools/make-www.js
      - run: npx cap add android && bash tools/android-patch.sh
      - name: Version
        run: |
          echo "VS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VS_VERSION_NAME=${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number)) }}" >> "$GITHUB_ENV"
      - name: Signing (only when the keystore secrets are set)
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VS_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "VS_KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - run: python3 tools/android-sign.py
        if: env.HAS_KEY == 'true'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk viper-sortie.apk
      - run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon
        if: env.HAS_KEY == 'true'
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk viper-sortie-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab viper-sortie-release.aab
        if: env.HAS_KEY == 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: viper-sortie-android
          path: |
            viper-sortie.apk
            viper-sortie-release.apk
            viper-sortie-release.aab
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-{0}', github.run_number)) }}
          name: Viper Sortie ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number)) }}
          files: |
            viper-sortie.apk
            viper-sortie-release.apk
            viper-sortie-release.aab
          body: Android build. viper-sortie.apk is debug-signed and installs directly (allow "install unknown apps" for your browser). The release APK and .aab only appear when signing secrets are configured.
  exe:
    # Windows portable exe (Electron) built from the same web files; attached to the same release as the APK
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/make-www.js
      - run: node -e "require('fs').cpSync('www','desktop/www',{recursive:true});require('fs').cpSync('fonts','desktop/www/fonts',{recursive:true})"
      - run: npm install --no-save electron@33 electron-builder@25
        working-directory: desktop
      - run: npx electron-builder --win portable --publish never
        working-directory: desktop
      - run: Copy-Item desktop/dist/viper-sortie.exe viper-sortie.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: viper-sortie-windows, path: viper-sortie.exe, if-no-files-found: error }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-{0}', github.run_number)) }}
          files: viper-sortie.exe
